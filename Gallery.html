<!DOCTYPE html>
<html lang="en">
<head>
    <title>Lesotho Photo Gallery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark main-nav">
    <div class="container">
        <a class="navbar-brand" href="index.html">Lesotho Tourism</a>
        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
                <li class="nav-item"><a class="nav-link active" href="gallery.html">Gallery</a></li>
                <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
            </ul>
        </div>
    </div>
</nav>

<header class="page-hero">
    <h1>Photo Gallery</h1>
    <p>A glimpse of the Mountain Kingdom</p>
</header>

<main class="container py-4">
    <div class="row g-3">
        <div class="col-md-8">
            <img id="galleryImage"
                 src="sehlaba thebe.jfif"
                 class="img-fluid rounded gallery-main"
                 alt="Mountain scenery">

            <div class="row g-2 mt-2">
                <div class="col-4">
                    <button class="thumbnail-button" onclick="selectPicture(0)">
                        <img src="Katse dam.jfif" alt="Mountains">
                    </button>
                </div>
                <div class="col-4">
                    <button class="thumbnail-button" onclick="selectPicture(1)">
                        <img src="lesotho mountain 1.jfif" alt="Landscape">
                    </button>
                </div>
                <div class="col-4">
                    <button class="thumbnail-button" onclick="selectPicture(2)">
                        <img src="lesotho mountain 2.jfif" alt="Mountain sky">
                    </button>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="gallery-info">
                <h2 id="galleryCaption">Mountain Scenery</h2>
                <p>Explore the beautiful landscapes of Lesotho.</p>
                <div class="d-flex justify-content-between mt-4">
                    <button class="btn btn-primary" id="previousImage">Previous</button>
                    <button class="btn btn-primary" id="nextImage">Next</button>
                </div>
            </div>
        </div>
    </div>

    <h2 class="mt-5">More Photos</h2>
    <div class="row g-3">
        <div class="col-sm-4">
            <img src="Makhaleng river.jfif" class="img-fluid rounded" alt="Waterfall">
        </div>
        <div class="col-sm-4">
            <img src="liphofung tourist.jfif" class="img-fluid rounded" alt="Hiking">
        </div>
        <div class="col-sm-4">
            <img src="liphofung cafe.jfif" class="img-fluid rounded" alt="Green landscape">
        </div>
    </div>
</main>

<footer>© 2026 Lesotho Tourism. All rights reserved.</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
